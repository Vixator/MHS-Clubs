services:
  ktor-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - .env
    environment:
      FIREBASE_SERVICE_ACCOUNT: /run/secrets/firebase.json
      GOOGLE_CALENDAR_SERVICE_ACCOUNT: /run/secrets/calendar.json
    ports:
      - "8080:8080"
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT:?Set FIREBASE_SERVICE_ACCOUNT in .env}:/run/secrets/firebase.json:ro
      - ${GOOGLE_CALENDAR_SERVICE_ACCOUNT:?Set GOOGLE_CALENDAR_SERVICE_ACCOUNT in .env}:/run/secrets/calendar.json:ro
