name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test server and compile clients
        run: ./gradlew --no-daemon :server:test :app:webApp:compileKotlinJs :app:androidApp:compileDebugKotlin
